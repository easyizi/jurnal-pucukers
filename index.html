<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurnal Pucukers - Live Monitoring</title>
    <style>
        :root {
            --primary: #0f172a;
            --secondary: #1e293b;
            --card-bg: #334155;
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.4);
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--primary);
            color: var(--text);
            line-height: 1.6;
            padding-bottom: 50px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--secondary);
            background: linear-gradient(180deg, rgba(15,23,42,0) 0%, rgba(30,41,59,0.5) 100%);
            border-radius: 0 0 20px 20px;
        }

        h1 {
            color: var(--accent);
            font-size: 2.5rem;
            text-shadow: 0 0 10px var(--accent-glow);
            margin-bottom: 5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-style: italic;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        input[type="text"], select {
            padding: 12px 20px;
            border-radius: 30px;
            border: 1px solid var(--secondary);
            background-color: var(--secondary);
            color: white;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
            min-width: 200px;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .card {
            background-color: var(--secondary);
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
            border-color: rgba(255,255,255,0.1);
        }

        .dream-reached-border {
            border: 1px solid var(--success) !important;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.2);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .ticker {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text);
            letter-spacing: 1px;
        }

        .company-name {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: -5px;
            margin-bottom: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-ca { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
        .badge-tech { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-naga { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge-risk { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

        .price-display {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
        }

        .current-price {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--text);
        }

        .price-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .target-box {
            margin-bottom: 15px;
        }

        .target-val {
            color: var(--accent);
            font-weight: bold;
            float: right;
        }

        .progress-container {
            width: 100%;
            background-color: rgba(255,255,255,0.1);
            border-radius: 10px;
            height: 8px;
            margin-top: 5px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #34d399);
            border-radius: 10px;
            width: 0%;
            transition: width 1s ease-in-out;
        }

        .status-badge {
            text-align: center;
            padding: 8px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-top: auto;
            margin-bottom: 15px;
        }

        .status-success {
            background-color: rgba(34, 197, 94, 0.2);
            color: var(--success);
            border: 1px solid var(--success);
            animation: pulse 2s infinite;
        }

        .status-process {
            background-color: rgba(245, 158, 11, 0.1);
            color: var(--warning);
            border: 1px dashed var(--warning);
        }

        .status-wait {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
        }

        .story {
            font-size: 0.85rem;
            color: var(--text-muted);
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
            line-height: 1.5;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        .timestamp {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-align: right;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🚀 Jurnal Pucukers Live</h1>
        <p class="subtitle">"Pantau Dream, Amankan Cuan"</p>
        <p style="font-size: 0.8rem; margin-top: 10px; color: var(--warning);">
            ⚠️ Data Pasar Terakhir (Snapshot)
        </p>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="🔍 Cari Kode Saham...">
        <select id="categoryFilter">
            <option value="all">📊 Semua Kategori</option>
            <option value="Aksi Korporasi">💼 Aksi Korporasi</option>
            <option value="Naga/Konglomerasi">🐉 Naga / Konglomerasi</option>
            <option value="Teknikal">📈 Teknikal / Pola</option>
            <option value="High Risk">🔥 High Risk / Gorengan</option>
            <option value="Dream Reached">✅ Dream Reached (Target Tercapai)</option>
        </select>
    </div>

    <div id="stockGrid" class="grid">
        </div>

</div>

<script>
    /**
     * Data Saham diperbarui dengan "Last Price" dari data pasar terkini.
     * Target Value (min) digunakan untuk logika perhitungan progress.
     */
    const stocks = [
        {
            ticker: "PANI",
            name: "Pantai Indah Kapuk Dua",
            category: "Naga/Konglomerasi",
            currentPrice: 13700,
            targetDisplay: "15.000 - 20.000",
            targetMin: 15000,
            support: "13.000",
            story: "Saham naga. Ekspansi agresif PIK 2. Harga sudah rally tinggi mendekati target awal."
        },
        {
            ticker: "FILM",
            name: "MD Pictures",
            category: "Aksi Korporasi",
            currentPrice: 10975,
            targetDisplay: "6.000+",
            targetMin: 6120,
            support: "3.500",
            story: "Target teori rights issue/PP di 6.000an sudah terlampaui jauh. Strong Uptrend."
        },
        {
            ticker: "NICL",
            name: "PAM Mineral",
            category: "Teknikal",
            currentPrice: 1075,
            targetDisplay: "600 - 700",
            targetMin: 700,
            support: "450",
            story: "Breakout ATH. Target teknikal 700 sudah jebol (exceeded). Fase mark-up lanjutan."
        },
        {
            ticker: "DKFT",
            name: "Central Omega Resources",
            category: "Teknikal",
            currentPrice: 705,
            targetDisplay: "500",
            targetMin: 500,
            support: "280",
            story: "Pola Cup & Handle valid. Target 500 sudah terlampaui. Menuju resisten berikutnya."
        },
        {
            ticker: "TIRA",
            name: "Tira Austenite",
            category: "High Risk",
            currentPrice: 1450,
            targetDisplay: "1.000 - 1.200",
            targetMin: 1200,
            support: "600",
            story: "Saham 'Gadai Kolor'. Target 1.200 sudah lewat. Hati-hati volatilitas tinggi."
        },
        {
            ticker: "AADI",
            name: "Adaro Andalan Indonesia",
            category: "Naga/Konglomerasi",
            currentPrice: 7425,
            targetDisplay: "8.000 - 10.000",
            targetMin: 8000,
            support: "6.000",
            story: "Anak usaha ADRO. Harga perlahan naik menuju target psikologis 8.000."
        },
        {
            ticker: "CCSI",
            name: "Comm. Cable Systems",
            category: "Aksi Korporasi",
            currentPrice: 350,
            targetDisplay: "386 - 700",
            targetMin: 386,
            support: "280",
            story: "Harga masih di bawah target teori RI (383-386). Potensi upside masih ada jika dijaga."
        },
        {
            ticker: "TNCA",
            name: "Trimuda Nuansa Citra",
            category: "High Risk",
            currentPrice: 248,
            targetDisplay: "400 - 500",
            targetMin: 400,
            support: "200",
            story: "Masih sideways di area bawah. Belum ada tanda spike ke target 400."
        },
        {
            ticker: "KJEN",
            name: "Krida Jaringan Nusantara",
            category: "Teknikal",
            currentPrice: 240,
            targetDisplay: "200",
            targetMin: 200,
            support: "130",
            story: "Pola tentara berbaris sukses. Target 200 sudah terlampaui."
        },
        {
            ticker: "DOSS",
            name: "Global Sukses Digital",
            category: "Teknikal",
            currentPrice: 246,
            targetDisplay: "400",
            targetMin: 400,
            support: "220",
            story: "Masih konsolidasi. Perlu breakout kuat untuk ke 400."
        },
        {
            ticker: "LABA",
            name: "Ladangbaja Murni",
            category: "Aksi Korporasi",
            currentPrice: 202,
            targetDisplay: "Wait & See",
            targetMin: 99999, // Set high to avoid false positive
            support: "190",
            story: "Isu rights issue kecil. Harga cenderung stagnan/turun. Wait and see."
        }
    ];

    const grid = document.getElementById('stockGrid');
    const searchInput = document.getElementById('searchInput');
    const categoryFilter = document.getElementById('categoryFilter');

    function formatRupiah(num) {
        return new Intl.NumberFormat('id-ID').format(num);
    }

    function renderCards(data) {
        grid.innerHTML = '';
        if (data.length === 0) {
            grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">Tidak ada data saham ditemukan.</p>';
            return;
        }

        data.forEach(stock => {
            // Logic Hitung Status Dream
            const isDreamReached = stock.currentPrice >= stock.targetMin;
            const progressPercent = Math.min((stock.currentPrice / stock.targetMin) * 100, 100);
            
            // Tentukan Kelas CSS Badge
            let badgeClass = 'badge-risk';
            if (stock.category.includes('Aksi')) badgeClass = 'badge-ca';
            else if (stock.category.includes('Teknikal')) badgeClass = 'badge-tech';
            else if (stock.category.includes('Naga')) badgeClass = 'badge-naga';

            // Tentukan Status Visual
            let statusHtml = '';
            let cardBorderClass = '';
            
            if (isDreamReached) {
                statusHtml = `<div class="status-badge status-success">🚀 DREAM REACHED ✅</div>`;
                cardBorderClass = 'dream-reached-border';
            } else if (progressPercent > 80) {
                statusHtml = `<div class="status-badge status-process">⏳ Almost There (${Math.round(progressPercent)}%)</div>`;
            } else {
                statusHtml = `<div class="status-badge status-wait">On Process...</div>`;
            }

            const card = document.createElement('div');
            card.className = `card ${cardBorderClass}`;
            card.innerHTML = `
                <div class="card-header">
                    <div>
                        <div class="ticker">${stock.ticker}</div>
                        <div class="company-name">${stock.name}</div>
                    </div>
                    <span class="badge ${badgeClass}">${stock.category}</span>
                </div>
                
                <div class="price-display">
                    <div>
                        <div class="price-label">Current Price</div>
                        <div class="current-price">Rp ${formatRupiah(stock.currentPrice)}</div>
                    </div>
                    <div style="text-align: right;">
                         <div class="price-label">Support</div>
                         <div style="color: var(--danger); font-weight: bold;">${stock.support}</div>
                    </div>
                </div>

                <div class="target-box">
                    <div style="display:flex; justify-content:space-between; font-size: 0.8rem; margin-bottom: 2px;">
                        <span class="price-label">Target / Dream</span>
                        <span class="target-val">${stock.targetDisplay}</span>
                    </div>
                    <div class="progress-container">
                        <div class="progress-bar" style="width: ${progressPercent}%"></div>
                    </div>
                </div>

                ${statusHtml}

                <div class="story">
                    ${stock.story}
                </div>
                <div class="timestamp">Last Update: Dec 2025</div>
            `;
            grid.appendChild(card);
        });
    }

    function filterData() {
        const searchTerm = searchInput.value.toLowerCase();
        const selectedCategory = categoryFilter.value;

        const filtered = stocks.filter(stock => {
            const matchSearch = stock.ticker.toLowerCase().includes(searchTerm) || 
                                stock.name.toLowerCase().includes(searchTerm);
            
            let matchCategory = true;
            if (selectedCategory === 'Dream Reached') {
                matchCategory = stock.currentPrice >= stock.targetMin;
            } else if (selectedCategory !== 'all') {
                matchCategory = stock.category.includes(selectedCategory);
            }
            
            return matchSearch && matchCategory;
        });

        renderCards(filtered);
    }

    // Event Listeners
    searchInput.addEventListener('input', filterData);
    categoryFilter.addEventListener('change', filterData);

    // Initial Render
    renderCards(stocks);

</script>

</body>
</html>
